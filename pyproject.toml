[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-engineering-mcp"
version = "0.1.0"
description = "Servidor MCP local para catálogo XLSX e geração segura de SQL Oracle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2.1,<3", "pandas>=3,<4", "openpyxl>=3.1,<4", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
data-engineering-mcp = "data_engineering_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_engineering_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
